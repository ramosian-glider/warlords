  function updateHUD() {
    if (!gameState) return;
    const fId = gameState.humanFaction, f = CONFIG.FACTIONS[fId];
    const badge = document.getElementById('faction-badge');
    badge.textContent = `${f.emoji} ${f.name.split(' ')[0]} ▾`;
    badge.style.background = f.color;

    const ownedTowns = gameState.towns.filter(t => t.owner === fId);
    const income = ownedTowns.reduce((s, t) => s + t.income, 0);
    const upkeep = EconomySystem.getFactionUpkeep(gameState, fId);
    const net = income - upkeep;
    const goldEl = document.getElementById('gold-stat');
    goldEl.textContent = `💰 ${gameState.factions[fId].gold} (${net >= 0 ? '+' : ''}${net})`;
    goldEl.style.color = net < 0 ? '#ef5350' : '';
    document.getElementById('town-stat').textContent = `🏰 ${ownedTowns.length}/${gameState.towns.length}`;
    document.getElementById('turn-stat').textContent = `⏳ ${gameState.turn}`;
    renderGameInfoDropdown();

    const avatar = document.getElementById('drawer-avatar');
    const title = document.getElementById('drawer-title');
    const sub = document.getElementById('drawer-sub');
    const btnBand = document.getElementById('btn-band');
    const btnWait = document.getElementById('btn-wait');

    const selUnit = gameState.units.find(u => u.id === selectedUnitId);
    if (selUnit) {
      const group = MovementSystem.getMoveGroup(gameState, selUnit);
      const def = CONFIG.UNITS[selUnit.type];
      const lvl = getUnitLevelInfo(selUnit);
      avatar.textContent = def.emoji;
      title.textContent = group.length > 1
        ? `Band (${group.length} units) • MP ${MovementSystem.getGroupMp(group)}`
        : `${def.name} ${lvl.badge} • HP ${selUnit.hp}/${getUnitMaxHp(selUnit)}`;
      sub.textContent = `ATK ${def.atk + lvl.atk} • DEF ${def.def + lvl.def} • MP ${selUnit.mp}/${def.maxMp} • XP ${selUnit.xp}`;
      const coLocated = getUnitsAt(gameState, selUnit.x, selUnit.y).filter(u => u.owner === fId);
      btnBand.disabled = coLocated.length < 2 && !selUnit.bandId;
      btnBand.textContent = selUnit.bandId ? '🔓 Disband' : '🔗 Band';
      btnWait.disabled = false;
    } else if (selectedTile) {
      const unitsHere = getUnitsAt(gameState, selectedTile.x, selectedTile.y).filter(u => u.type !== 'NEU_MILITIA' || u.revealed);
      const town = getTownAt(gameState, selectedTile.x, selectedTile.y);
      if (unitsHere.length > 0) {
        const top = unitsHere[0], def = CONFIG.UNITS[top.type], lvl = getUnitLevelInfo(top);
        const ownerName = top.owner === 'NEUTRAL' ? 'Neutral' : CONFIG.FACTIONS[top.owner].name;
        avatar.textContent = def.emoji;
        title.textContent = `${def.name}${unitsHere.length > 1 ? ` (×${unitsHere.length})` : ''} • HP ${top.hp}/${getUnitMaxHp(top)}`;
        sub.textContent = `${ownerName} • ATK ${def.atk + lvl.atk} • DEF ${def.def + lvl.def}`;
      } else if (town) {
        avatar.textContent = '🏰';
        title.textContent = `${town.name} (${town.owner ? CONFIG.FACTIONS[town.owner].name : 'Neutral'})`;
        const nextSuffix = town.nextProdUnit ? ` → ${CONFIG.UNITS[town.nextProdUnit].emoji}` : '';
        sub.textContent = town.prodUnit
          ? `Producing ${CONFIG.UNITS[town.prodUnit].emoji} ${CONFIG.UNITS[town.prodUnit].name} (${town.turnsLeft}t)${nextSuffix}`
          : `+${town.income} Gold/turn • Tap to manage`;
      } else {
        const tDef = CONFIG.TERRAIN[selectedTile.terrain];
        avatar.textContent = '🗺️'; title.textContent = tDef.name; sub.textContent = `Move Cost: ${tDef.moveCost} MP`;
      }
      btnBand.disabled = true; btnWait.disabled = true;
    } else {
      avatar.textContent = '🗺️'; title.textContent = 'Tap a unit or town';
      sub.textContent = 'Pan with 1 finger • Pinch or scroll to zoom';
      btnBand.disabled = true; btnWait.disabled = true;
    }

    const stackStrip = document.getElementById('stack-strip');
    stackStrip.innerHTML = '';
    if (selectedTile) {
      const friendlyOnTile = getUnitsAt(gameState, selectedTile.x, selectedTile.y).filter(u => u.owner === fId);
      const otherOnTile = getUnitsAt(gameState, selectedTile.x, selectedTile.y).filter(u => u.owner !== fId && (u.type !== 'NEU_MILITIA' || u.revealed));
      const townOnTile = getTownAt(gameState, selectedTile.x, selectedTile.y);

      if (friendlyOnTile.length > 1 || (friendlyOnTile.length >= 1 && townOnTile && townOnTile.owner === fId)) {
        friendlyOnTile.forEach(u => {
          const btn = document.createElement('button');
          btn.className = `stack-chip${u.id === selectedUnitId ? ' active' : ''}`;
          btn.textContent = `${CONFIG.UNITS[u.type].emoji}${u.hp}`;
          btn.onclick = () => {
            selectedUnitId = u.id;
            const grp = MovementSystem.getMoveGroup(gameState, u);
            reachableCache = MovementSystem.getGroupMp(grp) > 0
              ? MovementSystem.getReachableTiles(gameState, grp).reachable : null;
            updateHUD(); render();
          };
          stackStrip.appendChild(btn);
        });
        if (townOnTile && townOnTile.owner === fId) {
          const tBtn = document.createElement('button');
          tBtn.className = 'stack-chip';
          tBtn.textContent = '🏰';
          tBtn.onclick = () => showTownModal(townOnTile);
          stackStrip.appendChild(tBtn);
        }
      } else if (otherOnTile.length > 0 && !selUnit) {
        if (otherOnTile.length > 1 || townOnTile) {
          otherOnTile.forEach(u => {
            const btn = document.createElement('button');
            btn.className = 'stack-chip';
            btn.textContent = `${CONFIG.UNITS[u.type].emoji}${u.hp}`;
            btn.onclick = () => {
              const def = CONFIG.UNITS[u.type], lvl = getUnitLevelInfo(u);
              const ownerName = u.owner === 'NEUTRAL' ? 'Neutral' : CONFIG.FACTIONS[u.owner].name;
              avatar.textContent = def.emoji;
              title.textContent = `${def.name} ${lvl.badge} • HP ${u.hp}/${getUnitMaxHp(u)}`;
              sub.textContent = `${ownerName} • ATK ${def.atk + lvl.atk} • DEF ${def.def + lvl.def}`;
            };
            stackStrip.appendChild(btn);
          });
          if (townOnTile) {
            const tBtn = document.createElement('button');
            tBtn.className = 'stack-chip';
            tBtn.textContent = '🏰';
            tBtn.onclick = () => {
              avatar.textContent = '🏰';
              title.textContent = `${townOnTile.name} (${townOnTile.owner ? CONFIG.FACTIONS[townOnTile.owner].name : 'Neutral'})`;
              sub.textContent = `+${townOnTile.income} Gold/turn • +2 DEF & First Strike`;
            };
            stackStrip.appendChild(tBtn);
          }
        }
      }
    }
  }

  function handleTileTap(tx, ty) {
    if (gameState.winner) return;
    const tile = getTile(gameState, tx, ty);
    if (!tile) return;

    selectedTile = tile;
    const unitsHere = getUnitsAt(gameState, tx, ty).filter(u => u.owner === gameState.humanFaction);
    if (unitsHere.length > 0) {
      selectedUnitId = unitsHere[0].id;
      const group = MovementSystem.getMoveGroup(gameState, unitsHere[0]);
      reachableCache = MovementSystem.getGroupMp(group) > 0
        ? MovementSystem.getReachableTiles(gameState, group).reachable : null;
    } else {
      selectedUnitId = null; reachableCache = null;
      const town = getTownAt(gameState, tx, ty);
      if (town && town.owner === gameState.humanFaction) showTownModal(town);
    }
    updateHUD(); render();
  }

  let pointers = new Map(), lastDist = null, lastMid = null, dragStart = null, moved = false, longPressTimer = null, longPressed = false;

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      dragStart = { x: e.clientX, y: e.clientY, camX: camera.x, camY: camera.y };
      moved = false;
      longPressed = false;
      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(() => {
        if (!moved && pointers.size === 1) {
          longPressed = true;
          const rect = canvas.getBoundingClientRect();
          const ts = CONFIG.TILE_SIZE * camera.zoom;
          const tx = Math.floor((e.clientX - rect.left - camera.x) / ts);
          const ty = Math.floor((e.clientY - rect.top - camera.y) / ts);
          const selUnit = gameState.units.find(u => u.id === selectedUnitId);
          if (!selUnit || selUnit.owner !== gameState.humanFaction) return;
          const group = MovementSystem.getMoveGroup(gameState, selUnit);
          const enemiesHere = getUnitsAt(gameState, tx, ty).filter(u => u.owner !== gameState.humanFaction);
          const townHere = getTownAt(gameState, tx, ty);
          const isHostile = enemiesHere.length > 0 || (townHere && townHere.owner !== gameState.humanFaction);

          if (isHostile && MovementSystem.getGroupMp(group) >= 1) {
            let canAttack = CombatSystem.isAdjacent(selUnit.x, selUnit.y, tx, ty);
            if (!canAttack && reachableCache) {
              let bestAdj = null;
              for (const [k, info] of reachableCache.entries()) {
                if (CombatSystem.isAdjacent(info.x, info.y, tx, ty) && (MovementSystem.getGroupMp(group) - info.cost) >= 1) {
                  if (!bestAdj || info.cost < bestAdj.cost) bestAdj = info;
                }
              }
              if (bestAdj) { MovementSystem.moveGroup(gameState, group, bestAdj.x, bestAdj.y); canAttack = true; }
            }
            if (canAttack) {
              pendingEliminations.length = 0;
              const res = CombatSystem.resolveCombat(gameState, group, tx, ty);
              if (res) {
                const eliminated = pendingEliminations.splice(0);
                const capturedTown = (res.captured && !gameState.winner) ? getTownAt(gameState, tx, ty) : null;
                const openTown = (capturedTown && capturedTown.owner === gameState.humanFaction)
                  ? () => showTownModal(capturedTown)
                  : null;
                let onAfterBattle = openTown;
                let btnLabel = openTown ? 'Manage Town' : 'Close';
                if (gameState.winner) {
                  onAfterBattle = () => showVictoryModal();
                  btnLabel = 'Continue';
                } else if (eliminated.length > 0) {
                  onAfterBattle = () => showEliminatedModal(eliminated[0], openTown);
                  btnLabel = 'Continue';
                }
                showBattleModal(res.log, onAfterBattle, btnLabel);
                if (res.survivingAttackers.length === 0) selectedUnitId = null;
                reachableCache = null;
                updateHUD(); render(); return;
              }
            }
          }

          if (reachableCache && reachableCache.has(`${tx},${ty}`)) {
            MovementSystem.moveGroup(gameState, group, tx, ty);
            reachableCache = null;
            selectedTile = getTile(gameState, tx, ty);
            updateHUD(); render();
          }
        }
      }, 450);
    } else if (pointers.size === 2) {
      clearTimeout(longPressTimer);
      const rect = canvas.getBoundingClientRect();
      const pts = [...pointers.values()];
      lastDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      lastMid = {
        x: (pts[0].x + pts[1].x) / 2 - rect.left,
        y: (pts[0].y + pts[1].y) / 2 - rect.top
      };
      moved = true;
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1 && dragStart) {
      const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
      if (Math.hypot(dx, dy) > 6) { moved = true; clearTimeout(longPressTimer); }
      camera.x = dragStart.camX + dx; camera.y = dragStart.camY + dy; render();
    } else if (pointers.size === 2) {
      const rect = canvas.getBoundingClientRect();
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const mid = {
        x: (pts[0].x + pts[1].x) / 2 - rect.left,
        y: (pts[0].y + pts[1].y) / 2 - rect.top
      };
      if (lastDist && lastMid) {
        const newZoom = Math.max(0.5, Math.min(2.2, camera.zoom * (dist / lastDist)));
        const worldX = (lastMid.x - camera.x) / camera.zoom;
        const worldY = (lastMid.y - camera.y) / camera.zoom;
        camera.x = mid.x - worldX * newZoom;
        camera.y = mid.y - worldY * newZoom;
        camera.zoom = newZoom;
        render();
      }
      lastDist = dist;
      lastMid = mid;
    }
  });

  canvas.addEventListener('pointerup', (e) => {
    clearTimeout(longPressTimer);
    pointers.delete(e.pointerId);
    if (pointers.size < 2) { lastDist = null; lastMid = null; }
    if (pointers.size === 1) {
      const pt = [...pointers.values()][0];
      dragStart = { x: pt.x, y: pt.y, camX: camera.x, camY: camera.y };
    } else if (pointers.size === 0 && !moved && !longPressed) {
      const rect = canvas.getBoundingClientRect();
      const ts = CONFIG.TILE_SIZE * camera.zoom;
      handleTileTap(
        Math.floor((e.clientX - rect.left - camera.x) / ts),
        Math.floor((e.clientY - rect.top - camera.y) / ts)
      );
    }
  });

  canvas.addEventListener('pointercancel', (e) => {
    clearTimeout(longPressTimer);
    pointers.delete(e.pointerId);
    if (pointers.size < 2) { lastDist = null; lastMid = null; }
  });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const newZoom = Math.max(0.5, Math.min(2.2, camera.zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
    const worldX = (mx - camera.x) / camera.zoom;
    const worldY = (my - camera.y) / camera.zoom;
    camera.x = mx - worldX * newZoom;
    camera.y = my - worldY * newZoom;
    camera.zoom = newZoom;
    render();
  }, { passive: false });

  // =========================================================================
  // 12. BUTTONS & MODALS
  // =========================================================================
  const modalBackdrop = document.getElementById('modal-backdrop');
  const modalTitle = document.getElementById('modal-title');
  const modalBody = document.getElementById('modal-body');
  const modalFooter = document.getElementById('modal-footer');

  function openModal(title, bodyHtml, footerHtml = '', menuMode = false) {
    modalTitle.textContent = title; modalBody.innerHTML = bodyHtml; modalFooter.innerHTML = footerHtml;
    modalBackdrop.querySelector('.modal').classList.toggle('menu-mode', menuMode);
    document.getElementById('modal-close').style.visibility = gameState ? 'visible' : 'hidden';
    modalBackdrop.classList.add('open');
  }
  function closeModal() { modalBackdrop.classList.remove('open'); }
  document.getElementById('modal-close').onclick = closeModal;

  function showTownModal(town) {
    const roster = Object.values(CONFIG.UNITS).filter(u => u.faction === town.owner);
    const gold = gameState.factions[town.owner].gold;
    const unlocked = town.unlockedUnits || [];
    const curDef = town.prodUnit ? CONFIG.UNITS[town.prodUnit] : null;
    const nextDef = town.nextProdUnit ? CONFIG.UNITS[town.nextProdUnit] : null;
    const statusHtml = curDef
      ? `<div class="town-status">
           <span>🔨 ${curDef.emoji} ${curDef.name} (${town.turnsLeft}t)${nextDef ? ` → ${nextDef.emoji}` : ''}</span>
           <button class="btn-sm sec" id="town-pause" style="padding:4px 8px;font-size:11px">⏸️ Pause</button>
         </div>`
      : `<div class="town-status" style="color:var(--muted)">⏸️ Idle — choose a unit to produce</div>`;

    const cards = roster.map(u => {
      const isCurrent = town.prodUnit === u.id;
      const isNext = town.nextProdUnit === u.id;
      const isUnlocked = unlocked.includes(u.id);
      const canAfford = isUnlocked || gold >= u.cost;
      let actionHtml;
      if (isCurrent && !town.nextProdUnit) {
        actionHtml = `<span class="status-pill">🔨 Building</span>`;
      } else if (isNext) {
        actionHtml = `<span class="status-pill">⏭️ Queued</span>`;
      } else if (isUnlocked) {
        actionHtml = `<button class="btn-sm sec" data-buy="${u.id}">Select</button>`;
      } else {
        actionHtml = `<button class="btn-sm" data-buy="${u.id}" ${!canAfford ? 'disabled' : ''}>💰 ${u.cost}</button>`;
      }
      return `
        <div class="list-card">
          <div class="list-card-left">
            <div class="list-card-emoji">${u.emoji}</div>
            <div>
              <div style="font-weight:700;font-size:13px">${u.name}${isUnlocked ? ' ✓' : ''}</div>
              <div style="font-size:11px;color:var(--muted)">HP ${u.maxHp} • ATK ${u.atk} • DEF ${u.def} • ${u.buildTurns}t • ${u.upkeep}g/t</div>
            </div>
          </div>
          ${actionHtml}
        </div>`;
    }).join('');
    openModal(`🏰 ${town.name}`, statusHtml + cards, `<button class="btn-sm sec" onclick="document.getElementById('modal-close').click()">Close</button>`);
    const pauseBtn = document.getElementById('town-pause');
    if (pauseBtn) {
      pauseBtn.onclick = () => {
        EconomySystem.pauseProduction(gameState, town);
        showToast(`${town.name} production paused`);
        showTownModal(town);
        updateHUD();
      };
    }
    modalBody.querySelectorAll('[data-buy]').forEach(btn => {
      btn.onclick = () => {
        const unitId = btn.dataset.buy;
        const wasProducing = town.prodUnit;
        if (EconomySystem.buyProduction(gameState, town, unitId)) {
          const name = CONFIG.UNITS[unitId].name;
          const msg = (wasProducing && town.nextProdUnit === unitId)
            ? `Queued ${name} after current unit`
            : `Producing ${name}`;
          showToast(msg); showTownModal(town); updateHUD();
        }
      };
    });
  }

  function showBattleModal(log, onClose = null, btnLabel = null) {
    const label = btnLabel || (onClose ? 'Manage Town' : 'Close');
    openModal('⚔️ Battle Report', `<div class="battle-log">${log.join('<br>')}</div>`, `<button class="btn-sm" id="battle-ok">${label}</button>`);
    document.getElementById('battle-ok').onclick = () => {
      closeModal();
      if (onClose) onClose();
    };
  }

  const pendingEliminations = [];
  Hooks.on('onFactionEliminated', ({ factionId, state }) => {
    if (state === gameState) pendingEliminations.push(factionId);
  });

  function showEliminatedModal(factionId, onClose = null) {
    const f = CONFIG.FACTIONS[factionId];
    const isHuman = factionId === gameState.humanFaction;
    const footer = isHuman
      ? `<button class="btn-sm sec" id="elim-new">New Game</button><button class="btn-sm" id="elim-ok">Watch AI</button>`
      : `<button class="btn-sm" id="elim-ok">${onClose ? 'Continue' : 'Close'}</button>`;
    openModal(isHuman ? '💀 You Were Eliminated' : '💀 Faction Eliminated',
      `<div style="text-align:center;font-size:16px;padding:12px 0;">
        <div style="font-size:44px;">${f.emoji}</div>
        <p><strong>${f.name}</strong> has lost its last town and been wiped out!</p>
      </div>`,
      footer);
    const newBtn = document.getElementById('elim-new');
    if (newBtn) newBtn.onclick = () => showMenuModal();
    document.getElementById('elim-ok').onclick = () => {
      closeModal();
      if (onClose) onClose();
    };
  }

  function showVictoryModal() {
    const w = CONFIG.FACTIONS[gameState.winner], won = gameState.winner === gameState.humanFaction;
    openModal(won ? '🏆 Victory!' : '💀 Defeat',
      `<div style="text-align:center;font-size:18px;padding:12px 0;">
        <div style="font-size:48px;">${w.emoji}</div>
        <p><strong>${w.name}</strong> has conquered the realm in ${gameState.turn} turns!</p>
      </div>`,
      `<button class="btn-sm" id="vic-new">New Game</button>`);
    document.getElementById('vic-new').onclick = () => showNewGameModal();
  }

  function showNewGameModal() {
    const diffOrder = ['easy', 'normal', 'hard'];
    const sizeOrder = ['S', 'M', 'L', 'XL'];
    const curFaction = (gameState && gameState.humanFaction) || 'EMPIRE';
    const curDiff = (gameState && gameState.difficulty) || 'normal';
    const curSize = (gameState && gameState.mapSize) || 'M';
    const curDiffIdx = Math.max(0, diffOrder.indexOf(curDiff));
    const factionCardsHtml = ['EMPIRE', 'SYLVAN', 'UNDEAD'].map(fId => {
      const f = CONFIG.FACTIONS[fId];
      const shortName = f.name.split(' ')[0];
      const checked = fId === curFaction;
      return `
        <label class="faction-card${checked ? ' selected' : ''}" style="--fc-color:${f.color}" data-faction="${fId}">
          <input type="radio" name="new-faction" value="${fId}" ${checked ? 'checked' : ''}>
          <span class="fc-emoji">${f.emoji}</span>
          <span class="fc-name">${shortName}</span>
        </label>`;
    }).join('');
    const sizePillsHtml = sizeOrder.map(sId => {
      const sz = CONFIG.MAP_SIZES[sId];
      const checked = sId === curSize;
      return `
        <label class="size-pill${checked ? ' selected' : ''}" data-size="${sId}">
          <input type="radio" name="new-size" value="${sId}" ${checked ? 'checked' : ''}>
          <span class="sp-code">${sId}</span>
          <span class="sp-dim">${sz.width}×${sz.height}</span>
        </label>`;
    }).join('');
    const initDiff = CONFIG.DIFFICULTIES[diffOrder[curDiffIdx]];

    openModal('', `
      <div class="menu-hero" style="padding:0 0 2px;">
        <div class="menu-hero-title" style="font-size:20px;">New Game</div>
      </div>
      <div class="new-game-box">
        <div class="field-label">Choose Faction</div>
        <div class="faction-grid" id="faction-picker">${factionCardsHtml}</div>
        <div class="field-label">Map Size</div>
        <div class="size-grid" id="size-picker">${sizePillsHtml}</div>
        <div class="diff-wrap">
          <div class="diff-header">
            <span class="field-label">Difficulty</span>
            <span class="diff-badge" id="diff-badge">${initDiff.emoji} ${initDiff.label}</span>
          </div>
          <input type="range" class="diff-slider" id="diff-slider" min="0" max="2" step="1" value="${curDiffIdx}">
          <div class="diff-ticks"><span>Easy</span><span>Normal</span><span>Hard</span></div>
          <div class="diff-desc" id="diff-desc">${initDiff.desc}</div>
        </div>
        <button class="act-btn primary" id="m-new-start">Start Game</button>
      </div>
    `, `<button class="btn-sm sec" id="ng-back">Back</button>`, true);

    const picker = document.getElementById('faction-picker');
    picker.querySelectorAll('input[name="new-faction"]').forEach(radio => {
      radio.onchange = () => {
        picker.querySelectorAll('.faction-card').forEach(card => {
          card.classList.toggle('selected', card.dataset.faction === radio.value);
        });
      };
    });

    const sizePicker = document.getElementById('size-picker');
    sizePicker.querySelectorAll('input[name="new-size"]').forEach(radio => {
      radio.onchange = () => {
        sizePicker.querySelectorAll('.size-pill').forEach(pill => {
          pill.classList.toggle('selected', pill.dataset.size === radio.value);
        });
      };
    });

    const slider = document.getElementById('diff-slider');
    const diffBadge = document.getElementById('diff-badge');
    const diffDesc = document.getElementById('diff-desc');
    slider.oninput = () => {
      const d = CONFIG.DIFFICULTIES[diffOrder[Number(slider.value)]];
      diffBadge.textContent = `${d.emoji} ${d.label}`;
      diffDesc.textContent = d.desc;
    };

    document.getElementById('ng-back').onclick = showMenuModal;
    document.getElementById('m-new-start').onclick = () => {
      const f = picker.querySelector('input[name="new-faction"]:checked')?.value || 'EMPIRE';
      const sId = sizePicker.querySelector('input[name="new-size"]:checked')?.value || 'M';
      const dId = diffOrder[Number(slider.value)] || 'normal';
      gameState = MapGen.generate(f, Date.now(), dId, sId);
      StorageSystem.save(gameState, 'autosave');
      selectedUnitId = null; selectedTile = null; reachableCache = null;
      const startTown = gameState.towns.find(t => t.owner === f);
      if (startTown) centerCameraOn(startTown.x, startTown.y);
      closeModal(); updateHUD(); render();
      showToast(`${CONFIG.FACTIONS[f].emoji} ${CONFIG.DIFFICULTIES[dId].label} • ${sId} map`);
    };
  }

  let devTestsUnlocked = false;
  const magicSeq = ['BL', 'TL', 'TR', 'BR'];
  let magicProgress = 0;
  modalBackdrop.addEventListener('pointerdown', (e) => {
    if (devTestsUnlocked || !modalBackdrop.classList.contains('open')) return;
    if (!modalBackdrop.querySelector('.modal').classList.contains('menu-mode')) return;
    const nx = e.clientX / window.innerWidth;
    const ny = e.clientY / window.innerHeight;
    let corner = null;
    if (nx < 0.25 && ny > 0.75) corner = 'BL';
    else if (nx < 0.25 && ny < 0.25) corner = 'TL';
    else if (nx > 0.75 && ny < 0.25) corner = 'TR';
    else if (nx > 0.75 && ny > 0.75) corner = 'BR';
    if (!corner) { magicProgress = 0; return; }
    if (corner === magicSeq[magicProgress]) {
      magicProgress++;
      if (magicProgress === magicSeq.length) {
        devTestsUnlocked = true;
        magicProgress = 0;
        const tBtn = document.getElementById('m-tests');
        if (tBtn) tBtn.style.display = '';
        const sBtn = document.getElementById('m-sim');
        if (sBtn) sBtn.style.display = '';
        showToast('Developer tools unlocked');
      }
    } else {
      magicProgress = corner === magicSeq[0] ? 1 : 0;
    }
  });

  async function showSimModal(selectedSize = 'S') {
    const sizeOrder = ['S', 'M', 'L', 'XL'];
    const gamesBySize = { S: 50, M: 30, L: 15, XL: 10 };
    const gamesPerDiff = gamesBySize[selectedSize] || 50;
    const maxTurns = 100;
    const diffs = ['easy', 'normal', 'hard'];
    const totalGames = gamesPerDiff * diffs.length;
    const order = ['EMPIRE', 'SYLVAN', 'UNDEAD'];
    const tier3Ids = new Set(Object.values(CONFIG.UNITS).filter(u => u.cost >= 300).map(u => u.id));
    let cancelled = false;

    const sizePillsHtml = sizeOrder.map(sId => {
      const sz = CONFIG.MAP_SIZES[sId];
      const checked = sId === selectedSize;
      return `
        <label class="size-pill${checked ? ' selected' : ''}" data-sim-size="${sId}">
          <input type="radio" name="sim-size" value="${sId}" ${checked ? 'checked' : ''}>
          <span class="sp-code">${sId}</span>
          <span class="sp-dim">${sz.width}×${sz.height}</span>
        </label>`;
    }).join('');

    openModal('Balance Simulation',
      `<div class="size-grid" id="sim-size-picker">${sizePillsHtml}</div>
       <div id="sim-status" style="font-size:13px;color:var(--muted);text-align:center;padding:8px 0;">Running 0/${totalGames} games (${selectedSize})...</div>
       <div id="sim-results"></div>`,
      `<button class="btn-sm sec" id="sim-back">Back</button>`);
    document.getElementById('sim-back').onclick = () => { cancelled = true; showMenuModal(); };
    document.getElementById('sim-size-picker').querySelectorAll('input[name="sim-size"]').forEach(radio => {
      radio.onchange = () => { cancelled = true; showSimModal(radio.value); };
    });

    let done = 0;
    const cards = [];
    for (const dId of diffs) {
      const wins = { EMPIRE: 0, SYLVAN: 0, UNDEAD: 0, TIMEOUT: 0 };
      let turnsSum = 0, finished = 0, peakSum = 0, disbands = 0, t3Games = 0;
      for (let g = 0; g < gamesPerDiff; g++) {
        if (cancelled) return;
        const s = MapGen.generate('EMPIRE', 3000 + g * 37 + done * 13, dId, selectedSize);
        let peak = 0, hadT3 = false;
        for (let t = 1; t <= maxTurns && !s.winner; t++) {
          s.turn = t;
          for (let i = 0; i < 3; i++) {
            const fId = order[(g + i) % 3];
            if (!s.factions[fId].alive || s.winner) continue;
            const res = EconomySystem.processTurnStart(s, fId);
            disbands += res.disbanded;
            await AIController.runTurn(s, fId, 0);
            const cnt = s.units.filter(u => u.owner === fId).length;
            if (cnt > peak) peak = cnt;
            if (s.towns.some(tw => (tw.unlockedUnits || []).some(id => tier3Ids.has(id)))) hadT3 = true;
          }
        }
        if (s.winner) { wins[s.winner]++; turnsSum += s.turn; finished++; }
        else wins.TIMEOUT++;
        peakSum += peak;
        if (hadT3) t3Games++;
        done++;
        if (done % 2 === 0 || done === totalGames) {
          const st = document.getElementById('sim-status');
          if (st) st.textContent = done < totalGames ? `Running ${done}/${totalGames} games (${selectedSize})...` : `Completed ${totalGames} games (${gamesPerDiff}/difficulty on ${selectedSize})`;
          await new Promise(r => setTimeout(r, 0));
        }
      }
      const d = CONFIG.DIFFICULTIES[dId];
      cards.push(`
        <div class="list-card" style="flex-direction:column;align-items:stretch;gap:6px;">
          <div style="display:flex;justify-content:space-between;font-weight:700;font-size:13px;">
            <span>${d.emoji} ${d.label} (${gamesPerDiff} games)</span>
            <span style="color:var(--muted)">Avg ${finished ? (turnsSum / finished).toFixed(1) : '-'}t</span>
          </div>
          <div style="font-size:12px;display:flex;justify-content:space-between;">
            <span>👑 ${wins.EMPIRE}</span><span>🌿 ${wins.SYLVAN}</span><span>☠️ ${wins.UNDEAD}</span><span>⏱️ ${wins.TIMEOUT}</span>
          </div>
          <div style="font-size:11px;color:var(--muted);">Peak units: ${(peakSum / gamesPerDiff).toFixed(1)} • Tier 3+: ${t3Games}/${gamesPerDiff} • Disbands: ${(disbands / gamesPerDiff).toFixed(1)}</div>
        </div>`);
      const resEl = document.getElementById('sim-results');
      if (resEl) resEl.innerHTML = cards.join('');
    }
  }

  function showMenuModal() {
    const hasAutosave = !gameState && !!StorageSystem.load('autosave');
    const continueBtn = gameState
      ? `<button class="act-btn" id="m-continue">Resume Game</button>`
      : (hasAutosave ? `<button class="act-btn" id="m-continue">Continue Autosave</button>` : '');

    openModal('', `
      <div class="menu-hero">
        <div class="menu-hero-icon">⚔️</div>
        <div class="menu-hero-title">Emoji Warlords</div>
      </div>
      <button class="act-btn primary" id="m-new-game">New Game</button>
      ${continueBtn}
      <button class="act-btn" id="m-visual">Visual Mode: ${pixelArtMode ? 'Pixel Art' : 'Emoji'}</button>
      <button class="act-btn" id="m-save" ${!gameState ? 'disabled' : ''}>Save Slot 1</button>
      <button class="act-btn" id="m-load">Load Slot 1</button>
      <button class="act-btn" id="m-tests" style="${devTestsUnlocked ? '' : 'display:none'}">Run Unit Tests</button>
      <button class="act-btn" id="m-sim" style="${devTestsUnlocked ? '' : 'display:none'}">Run Balance Simulation</button>
    `, '', true);

    document.getElementById('m-new-game').onclick = showNewGameModal;
    document.getElementById('m-visual').onclick = () => {
      pixelArtMode = !pixelArtMode;
      try { localStorage.setItem('emoji_warlords_pixel_mode', pixelArtMode ? '1' : '0'); } catch (e) {}
      document.getElementById('m-visual').textContent = `Visual Mode: ${pixelArtMode ? 'Pixel Art' : 'Emoji'}`;
      render();
      showToast(pixelArtMode ? 'Pixel Art mode enabled' : 'Emoji mode enabled');
    };
    const contEl = document.getElementById('m-continue');
    if (contEl) {
      contEl.onclick = () => {
        if (!gameState) {
          const loaded = StorageSystem.load('autosave');
          if (loaded) {
            gameState = loaded;
            selectedUnitId = null; selectedTile = null; reachableCache = null;
            const startTown = gameState.towns.find(t => t.owner === gameState.humanFaction);
            if (startTown) centerCameraOn(startTown.x, startTown.y);
            closeModal(); updateHUD(); render(); showToast('Resumed autosave');
          }
        } else {
          closeModal();
        }
      };
    }
    document.getElementById('m-save').onclick = () => {
      if (!gameState) return;
      StorageSystem.save(gameState, 'save_1'); showToast('Saved to Slot 1'); closeModal();
    };
    document.getElementById('m-load').onclick = () => {
      const loaded = StorageSystem.load('save_1');
      if (loaded) {
        gameState = loaded; selectedUnitId = null; selectedTile = null; reachableCache = null;
        const startTown = gameState.towns.find(t => t.owner === gameState.humanFaction);
        if (startTown) centerCameraOn(startTown.x, startTown.y);
        closeModal(); updateHUD(); render(); showToast('Loaded Slot 1');
      } else showToast('No save in Slot 1');
    };
    document.getElementById('m-tests').onclick = () => {
      const results = TestRunner.runAll(), passed = results.filter(r => r.pass).length;
      const html = results.map(r => `<div class="list-card"><span style="font-size:12px;font-family:monospace;min-width:0;overflow-wrap:anywhere">${r.name}</span><span class="${r.pass ? 'test-pass' : 'test-fail'}" style="flex-shrink:0">${r.pass ? 'PASS' : 'FAIL'}</span></div>`).join('');
      openModal(`Unit Tests (${passed}/${results.length})`, html, `<button class="btn-sm sec" id="t-back">Back</button>`);
      document.getElementById('t-back').onclick = showMenuModal;
    };
    document.getElementById('m-sim').onclick = () => showSimModal((gameState && gameState.mapSize) || 'S');
  }

  document.getElementById('menu-btn').onclick = showMenuModal;

  document.getElementById('btn-band').onclick = () => {
    const sel = gameState.units.find(u => u.id === selectedUnitId);
    if (!sel) return;
    if (sel.bandId) { MovementSystem.disbandGroup(gameState, MovementSystem.getMoveGroup(gameState, sel)); showToast('Band disbanded'); }
    else { MovementSystem.bandUnitsAt(gameState, sel.x, sel.y, gameState.humanFaction); showToast('Units banded'); }
    const group = MovementSystem.getMoveGroup(gameState, sel);
    reachableCache = MovementSystem.getGroupMp(group) > 0 ? MovementSystem.getReachableTiles(gameState, group).reachable : null;
    updateHUD(); render();
  };

  document.getElementById('btn-wait').onclick = () => {
    const sel = gameState.units.find(u => u.id === selectedUnitId);
    if (!sel) return;
    MovementSystem.getMoveGroup(gameState, sel).forEach(u => { u.waited = true; });
    document.getElementById('btn-next').click();
  };

  document.getElementById('btn-next').onclick = () => {
    const candidates = gameState.units.filter(u => u.owner === gameState.humanFaction && u.mp > 0 && !u.waited);
    if (candidates.length === 0) { showToast('No units with MP remaining'); return; }
    const idx = candidates.findIndex(u => u.id === selectedUnitId);
    const next = candidates[(idx + 1) % candidates.length];
    selectedUnitId = next.id;
    selectedTile = getTile(gameState, next.x, next.y);
    const group = MovementSystem.getMoveGroup(gameState, next);
    reachableCache = MovementSystem.getReachableTiles(gameState, group).reachable;
    centerCameraOn(next.x, next.y);
    updateHUD(); render();
  };

  async function runSpectatorTurns() {
    const runState = gameState;
    const btnEnd = document.getElementById('btn-end');
    btnEnd.disabled = true;
    btnEnd.textContent = 'Spectating...';
    selectedUnitId = null; reachableCache = null;
    updateHUD(); render();
    while (!runState.winner && gameState === runState) {
      runState.turn++;
      for (const fId of ['EMPIRE', 'SYLVAN', 'UNDEAD']) {
        if (gameState !== runState) break;
        if (!runState.factions[fId].alive || runState.winner) continue;
        showToast(`${CONFIG.FACTIONS[fId].emoji} ${CONFIG.FACTIONS[fId].name} turn`);
        EconomySystem.processTurnStart(runState, fId);
        await AIController.runTurn(runState, fId, 160, () => {
          if (gameState === runState) { updateHUD(); render(); }
        });
        if (runState.winner) break;
      }
    }
    btnEnd.disabled = false;
    btnEnd.textContent = 'End Turn';
    if (gameState === runState && runState.winner) {
      pendingEliminations.length = 0;
      showVictoryModal();
    }
    updateHUD(); render();
  }

  document.getElementById('btn-end').onclick = async () => {
    if (gameState.winner) return;
    if (!gameState.factions[gameState.humanFaction].alive) {
      runSpectatorTurns();
      return;
    }
    const runState = gameState;
    const btnEnd = document.getElementById('btn-end');
    btnEnd.disabled = true;
    btnEnd.textContent = 'AI Turn...';
    selectedUnitId = null; reachableCache = null;
    updateHUD(); render();
    for (const fId of ['EMPIRE', 'SYLVAN', 'UNDEAD']) {
      if (gameState !== runState) return;
      if (fId === gameState.humanFaction || !gameState.factions[fId].alive) continue;
      showToast(`${CONFIG.FACTIONS[fId].emoji} ${CONFIG.FACTIONS[fId].name} turn`);
      EconomySystem.processTurnStart(gameState, fId);
      await AIController.runTurn(gameState, fId, 240, () => { updateHUD(); render(); });
      if (gameState.winner) break;
    }
    if (gameState !== runState) return;
    if (!gameState.winner) {
      if (!gameState.factions[gameState.humanFaction].alive) {
        pendingEliminations.length = 0;
        btnEnd.disabled = true;
        btnEnd.textContent = 'Eliminated';
        updateHUD(); render();
        showEliminatedModal(gameState.humanFaction, () => runSpectatorTurns());
        return;
      }
      gameState.turn++;
      const turnRes = EconomySystem.processTurnStart(gameState, gameState.humanFaction);
      if (turnRes && turnRes.disbanded > 0) {
        showToast(`⚠️ Upkeep unpaid! Disbanded ${turnRes.disbanded} unit${turnRes.disbanded > 1 ? 's' : ''}`);
      }
      StorageSystem.save(gameState, 'autosave');
      if (pendingEliminations.length > 0) {
        const eliminated = pendingEliminations.splice(0);
        showEliminatedModal(eliminated[0]);
      }
    } else {
      pendingEliminations.length = 0;
      showVictoryModal();
    }
    btnEnd.disabled = false;
    btnEnd.textContent = 'End Turn';
    updateHUD(); render();
  };

  function bootRender() {
    if (window.innerHeight < 100) {
      document.getElementById('app').style.minHeight = '560px';
    }
    resizeCanvas();
    updateHUD();
    render();
  }
  bootRender();
  showMenuModal();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(bootRender);
})();
</script>
</body>
</html>
