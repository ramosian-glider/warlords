<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Emoji Warlords</title>
<style>
  :root {
    --bg: #12151a;
    --surface: #1d222b;
    --surface-2: #272d38;
    --border: #363e4d;
    --text: #f0f4f8;
    --muted: #9aa5b1;
    --accent: #f59e0b;
    --empire: #1976d2;
    --sylvan: #2e7d32;
    --undead: #6a1b9a;
    --danger: #e53935;
    --success: #43a047;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100dvh; min-height: 380px; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  #app {
    display: flex; flex-direction: column; width: 100%; height: 100dvh; min-height: 380px; max-width: 600px;
    margin: 0 auto; background: var(--bg); position: relative;
  }
  /* Top Status Bar */
  #topbar {
    height: 48px; min-height: 48px; flex-shrink: 0; background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; gap: 6px; z-index: 10;
  }
  .faction-pill {
    display: flex; align-items: center; gap: 6px; padding: 4px 10px;
    border-radius: 999px; font-weight: 700; font-size: 13px; color: #fff;
    white-space: nowrap;
  }
  .stat-pill {
    display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600;
    background: var(--surface-2); padding: 4px 8px; border-radius: 8px; white-space: nowrap;
  }
  .icon-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; height: 34px; min-width: 34px; padding: 0 10px;
    font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { transform: scale(0.95); }

  /* Canvas Map */
  #map-wrap {
    flex: 1 1 0%; min-height: 200px; position: relative; overflow: hidden; background: #0d1014; touch-action: none;
  }
  #game-canvas { display: block; width: 100%; height: 100%; }
  #toast {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(18, 21, 26, 0.92); border: 1px solid var(--border);
    color: var(--text); padding: 6px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; pointer-events: none;
    opacity: 0; transition: opacity 0.2s; z-index: 15; white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  /* Bottom Action Drawer */
  #drawer {
    flex-shrink: 0; min-height: 132px; background: var(--surface);
    border-top: 1px solid var(--border); padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; justify-content: space-between; gap: 6px; z-index: 10;
  }
  .drawer-info {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    min-height: 68px;
  }
  .drawer-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .unit-avatar {
    font-size: 30px; width: 48px; height: 48px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .info-lines { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .info-title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stack-strip { display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; max-width: 185px; flex-shrink: 0; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .stack-strip::-webkit-scrollbar { display: none; }
  .stack-chip {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 4px 6px; font-size: 12px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; gap: 3px; flex-shrink: 0;
  }
  .stack-chip.active { border-color: var(--accent); background: rgba(245, 158, 11, 0.2); }
  .drawer-actions {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  }
  .act-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; height: 42px; font-size: 12px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 0 4px;
  }
  .act-btn.primary { background: var(--accent); color: #111; border-color: var(--accent); }
  .act-btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .act-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .act-btn:active:not(:disabled) { transform: scale(0.97); }

  /* Modals */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.72);
    display: none; align-items: center; justify-content: center; padding: 14px; z-index: 999;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #1d222b; border: 1px solid var(--border); border-radius: 14px;
    width: 100%; max-width: 440px; min-height: 160px; max-height: 85%;
    display: flex; flex-direction: column; flex-shrink: 0;
    overflow: hidden; box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .modal-header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 16px;
  }
  .modal-body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .modal-footer {
    padding: 10px 16px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 8px;
  }
  .list-card {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .list-card-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .list-card-emoji { font-size: 26px; }
  .btn-sm {
    background: var(--accent); color: #111; border: none; border-radius: 8px;
    padding: 8px 12px; font-weight: 700; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .btn-sm.sec { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }
  .battle-log {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    background: #0d1014; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; max-height: 240px; overflow-y: auto; line-height: 1.5;
  }
  .test-pass { color: #66bb6a; font-weight: 700; }
  .test-fail { color: #ef5350; font-weight: 700; }

  /* New Game Controls */
  .new-game-box {
    display: flex; flex-direction: column; gap: 12px;
    background: rgba(13, 16, 20, 0.45); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
  }
  .field-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted);
  }
  .faction-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .faction-card {
    position: relative; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4px; padding: 10px 6px; border-radius: 10px;
    background: var(--surface-2); border: 2px solid var(--border);
    cursor: pointer; text-align: center; transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }
  .faction-card input { position: absolute; opacity: 0; pointer-events: none; }
  .faction-card:active { transform: scale(0.97); }
  .faction-card .fc-emoji { font-size: 24px; line-height: 1; }
  .faction-card .fc-name { font-size: 12px; font-weight: 700; color: var(--text); }
  .faction-card.selected {
    border-color: var(--fc-color, var(--accent));
    background: color-mix(in srgb, var(--fc-color, var(--accent)) 22%, var(--surface-2));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--fc-color, var(--accent)) 45%, transparent);
  }
  .diff-wrap { display: flex; flex-direction: column; gap: 6px; }
  .diff-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .diff-badge {
    font-size: 12px; font-weight: 700; color: var(--accent);
    background: rgba(245, 158, 11, 0.14); border: 1px solid rgba(245, 158, 11, 0.35);
    padding: 2px 8px; border-radius: 999px;
  }
  .diff-slider {
    -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
    border-radius: 999px; background: var(--surface-2); outline: none;
    border: 1px solid var(--border); cursor: pointer;
  }
  .diff-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 20px; height: 20px;
    border-radius: 50%; background: var(--accent); border: 2px solid #111;
    box-shadow: 0 2px 6px rgba(0,0,0,0.45); cursor: pointer;
  }
  .diff-slider::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%; background: var(--accent);
    border: 2px solid #111; box-shadow: 0 2px 6px rgba(0,0,0,0.45); cursor: pointer;
  }
  .diff-ticks {
    display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-weight: 600;
  }
  .diff-desc { font-size: 12px; color: var(--muted); min-height: 16px; }
  .town-status {
    background: rgba(13, 16, 20, 0.55); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; font-size: 12px; font-weight: 600;
    color: var(--text); display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .status-pill {
    font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 8px;
    background: rgba(245, 158, 11, 0.16); color: var(--accent);
    border: 1px solid rgba(245, 158, 11, 0.4); white-space: nowrap;
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="faction-badge" class="faction-pill">👑 Empire</div>
    <div class="stat-pill" id="gold-stat">💰 0 (+0)</div>
    <div class="stat-pill" id="town-stat">🏰 0/0</div>
    <div class="stat-pill" id="turn-stat">T1</div>
    <button class="icon-btn" id="menu-btn" aria-label="Menu">☰</button>
  </header>

  <main id="map-wrap">
    <canvas id="game-canvas"></canvas>
    <div id="toast"></div>
  </main>

  <footer id="drawer">
    <div class="drawer-info" id="drawer-info">
      <div class="drawer-left">
        <div class="unit-avatar" id="drawer-avatar">🗺️</div>
        <div class="info-lines">
          <div class="info-title" id="drawer-title">Tap a unit or town</div>
          <div class="info-sub" id="drawer-sub">Pan with 1 finger • Pinch or scroll to zoom</div>
        </div>
      </div>
      <div class="stack-strip" id="stack-strip"></div>
    </div>
    <div class="drawer-actions" id="drawer-actions">
      <button class="act-btn" id="btn-band" disabled>🔗 Band</button>
      <button class="act-btn" id="btn-wait" disabled>⏸ Wait</button>
      <button class="act-btn" id="btn-next">⏭️ Next</button>
      <button class="act-btn primary" id="btn-end">End Turn</button>
    </div>
  </footer>

  <!-- Generic Modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <span id="modal-title">Menu</span>
        <button class="icon-btn" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // =========================================================================
  // 1. CONFIG TABLES
  // =========================================================================
  const CONFIG = {
    MAP_WIDTH: 16,
    MAP_HEIGHT: 22,
    TILE_SIZE: 44,
    MAX_STACK: 6,
    MIN_TOWN_DIST: 4,
    TOWN_COUNT_MIN: 12,
    TOWN_COUNT_MAX: 16,
    TOWN_INCOME: 25,
    TERRAIN: {
      PLAINS:    { id: 'PLAINS',    name: 'Plains',    color: '#8bc34a', moveCost: 2 },
      WOODS:     { id: 'WOODS',     name: 'Woods',     color: '#388e3c', moveCost: 3 },
      MOUNTAINS: { id: 'MOUNTAINS', name: 'Mountains', color: '#78909c', moveCost: 5 },
      SNOW:      { id: 'SNOW',      name: 'Snow',      color: '#eceff1', moveCost: 4 },
      TOWN:      { id: 'TOWN',      name: 'Town',      color: '#d7ccc8', moveCost: 2 }
    },
    TERRAIN_MODS: {
      PLAINS:    { defaultAtk: 0,  defaultDef: 0 },
      WOODS:     { defaultAtk: 0,  defaultDef: 1 },
      MOUNTAINS: { defaultAtk: 0,  defaultDef: 2 },
      SNOW:      { defaultAtk: -1, defaultDef: 0 },
      TOWN:      { defaultAtk: 0,  defaultDef: 2, firstStrike: true }
    },
    FACTIONS: {
      EMPIRE: { id: 'EMPIRE', name: 'Crown Empire',    emoji: '👑', color: '#1976d2' },
      SYLVAN: { id: 'SYLVAN', name: 'Sylvan Covenant', emoji: '🌿', color: '#2e7d32' },
      UNDEAD: { id: 'UNDEAD', name: 'Blight Legion',   emoji: '☠️', color: '#6a1b9a' }
    },
    UNITS: {
      EMP_SCOUT:   { id: 'EMP_SCOUT',   faction: 'EMPIRE', emoji: '🥷', name: 'Shadow Scout',  cost: 100, buildTurns: 1, upkeep: 1, maxHp: 10, atk: 3, def: 2, maxMp: 14, role: 1, traits: ['WOODS_STRIDE'] },
      EMP_GUARD:   { id: 'EMP_GUARD',   faction: 'EMPIRE', emoji: '💂', name: 'Royal Guard',   cost: 150, buildTurns: 1, upkeep: 1, maxHp: 14, atk: 4, def: 5, maxMp: 10, role: 1, traits: ['TOWN_DEFENDER'] },
      EMP_PALADIN: { id: 'EMP_PALADIN', faction: 'EMPIRE', emoji: '🦸', name: 'Paladin',       cost: 350, buildTurns: 2, upkeep: 2, maxHp: 20, atk: 7, def: 7, maxMp: 8,  role: 2, traits: ['HOLY_AURA'] },
      EMP_KNIGHT:  { id: 'EMP_KNIGHT',  faction: 'EMPIRE', emoji: '🏇', name: 'Heavy Knight',  cost: 400, buildTurns: 3, upkeep: 3, maxHp: 22, atk: 8, def: 6, maxMp: 12, role: 1, traits: ['CHARGE', 'NO_MOUNTAIN'] },
      EMP_EAGLE:   { id: 'EMP_EAGLE',   faction: 'EMPIRE', emoji: '🦅', name: 'Giant Eagle',   cost: 600, buildTurns: 4, upkeep: 4, maxHp: 24, atk: 9, def: 6, maxMp: 16, role: 3, traits: ['FLYING'] },
      SYL_PIXIE:   { id: 'SYL_PIXIE',   faction: 'SYLVAN', emoji: '🧚', name: 'Forest Pixie',  cost: 100, buildTurns: 1, upkeep: 1, maxHp: 8,  atk: 3, def: 3, maxMp: 14, role: 3, traits: ['FLYING'] },
      SYL_ELF:     { id: 'SYL_ELF',     faction: 'SYLVAN', emoji: '🧝', name: 'Sylvan Archer', cost: 160, buildTurns: 1, upkeep: 1, maxHp: 12, atk: 5, def: 4, maxMp: 10, role: 2, traits: ['WOODS_MASTER'] },
      SYL_TROLL:   { id: 'SYL_TROLL',   faction: 'SYLVAN', emoji: '🧌', name: 'Moss Troll',    cost: 360, buildTurns: 2, upkeep: 2, maxHp: 26, atk: 7, def: 6, maxMp: 8,  role: 1, traits: ['REGENERATE'] },
      SYL_UNICORN: { id: 'SYL_UNICORN', faction: 'SYLVAN', emoji: '🦄', name: 'Unicorn',       cost: 420, buildTurns: 3, upkeep: 3, maxHp: 20, atk: 8, def: 7, maxMp: 14, role: 1, traits: ['WOODS_STRIDE', 'PLAINS_BONUS'] },
      SYL_DRAGON:  { id: 'SYL_DRAGON',  faction: 'SYLVAN', emoji: '🐉', name: 'Emerald Dragon',cost: 750, buildTurns: 5, upkeep: 4, maxHp: 32, atk: 11,def: 9, maxMp: 16, role: 3, traits: ['FLYING', 'MOUNTAIN_HOME'] },
      UND_BAT:     { id: 'UND_BAT',     faction: 'UNDEAD', emoji: '🦇', name: 'Dread Bat',     cost: 90,  buildTurns: 1, upkeep: 1, maxHp: 9,  atk: 4, def: 2, maxMp: 14, role: 3, traits: ['FLYING'] },
      UND_SKEL:    { id: 'UND_SKEL',    faction: 'UNDEAD', emoji: '💀', name: 'Skeleton',      cost: 120, buildTurns: 1, upkeep: 1, maxHp: 13, atk: 4, def: 4, maxMp: 10, role: 1, traits: ['SNOW_WALKER'] },
      UND_GHOUL:   { id: 'UND_GHOUL',   faction: 'UNDEAD', emoji: '🧟', name: 'Rotting Ghoul', cost: 300, buildTurns: 2, upkeep: 2, maxHp: 24, atk: 7, def: 6, maxMp: 8,  role: 1, traits: ['SNOW_BONUS'] },
      UND_WOLF:    { id: 'UND_WOLF',    faction: 'UNDEAD', emoji: '🐺', name: 'Dire Wolf',     cost: 350, buildTurns: 2, upkeep: 3, maxHp: 18, atk: 8, def: 5, maxMp: 14, role: 1, traits: ['PACK_HUNTER'] },
      UND_DEMON:   { id: 'UND_DEMON',   faction: 'UNDEAD', emoji: '👹', name: 'Abyssal Oni',   cost: 700, buildTurns: 4, upkeep: 4, maxHp: 30, atk: 11,def: 8, maxMp: 10, role: 2, traits: ['MOUNTAIN_STRIDE'] },
      NEU_MILITIA: { id: 'NEU_MILITIA', faction: 'NEUTRAL', emoji: '🛡️', name: 'Town Militia', cost: 0,   buildTurns: 1, upkeep: 0, maxHp: 10, atk: 3, def: 4, maxMp: 0,  role: 1, traits: ['TOWN_DEFENDER'] }
    },
    XP_LEVELS: [
      { level: 1, xp: 0,   atk: 0, def: 0, hp: 0, badge: '' },
      { level: 2, xp: 25,  atk: 1, def: 1, hp: 2, badge: '•' },
      { level: 3, xp: 60,  atk: 2, def: 2, hp: 4, badge: '••' },
      { level: 4, xp: 110, atk: 3, def: 3, hp: 6, badge: '★' }
    ],
    DIFFICULTIES: {
      easy:   { id: 'easy',   label: 'Easy',   emoji: '🌱', desc: 'Passive AI that garrisons towns and expands slowly',        aiMaxBand: 2, aiBuyChance: 0.45, aiUpgradeGold: 700, aiSkipChance: 0.40, aiGarrison: 'all' },
      normal: { id: 'normal', label: 'Normal', emoji: '⚔️', desc: 'Balanced AI that defends its capital and expands steadily', aiMaxBand: 3, aiBuyChance: 0.80, aiUpgradeGold: 500, aiSkipChance: 0.15, aiGarrison: 'capital' },
      hard:   { id: 'hard',   label: 'Hard',   emoji: '🔥', desc: 'Aggressive AI with full bands and relentless expansion',    aiMaxBand: 4, aiBuyChance: 1.0,  aiUpgradeGold: 420, aiSkipChance: 0,    aiGarrison: 'none' }
    }
  };

  // =========================================================================
  // 2. HOOKS BUS
  // =========================================================================
  const Hooks = {
    _listeners: {},
    on(event, fn) {
      (this._listeners[event] ??= []).push(fn);
      return () => {
        this._listeners[event] = (this._listeners[event] || []).filter(f => f !== fn);
      };
    },
    emit(event, ctx) {
      for (const fn of (this._listeners[event] || [])) fn(ctx);
      return ctx;
    }
  };

  Hooks.on('onMoveCost', (ctx) => {
    const def = CONFIG.UNITS[ctx.unit.type];
    if (!def) return;
    if (def.traits.includes('FLYING')) { ctx.cost = 2; return; }
    if (def.traits.includes('NO_MOUNTAIN') && ctx.tile.terrain === 'MOUNTAINS' && !ctx.tile.hasTown) { ctx.cost = Infinity; return; }
    if (def.traits.includes('WOODS_STRIDE') && ctx.tile.terrain === 'WOODS') ctx.cost = Math.max(1, ctx.cost - 1);
    if (def.traits.includes('SNOW_WALKER') && ctx.tile.terrain === 'SNOW') ctx.cost = 2;
    if (def.traits.includes('MOUNTAIN_STRIDE') && ctx.tile.terrain === 'MOUNTAINS') ctx.cost = 2;
  });

  Hooks.on('onCalculateCombatStats', (ctx) => {
    const def = CONFIG.UNITS[ctx.unit.type];
    if (!def) return;
    const terrain = ctx.tile.hasTown ? 'TOWN' : ctx.tile.terrain;
    if (def.traits.includes('TOWN_DEFENDER') && ctx.tile.hasTown && ctx.isDefender) ctx.def += 2;
    if (def.traits.includes('HOLY_AURA') || ctx.allies.some(a => a.hp > 0 && CONFIG.UNITS[a.type]?.traits.includes('HOLY_AURA'))) {
      if (ctx.enemies.some(e => e.hp > 0 && e.owner === 'UNDEAD')) ctx.atk += 1;
    }
    if (def.traits.includes('CHARGE') && terrain === 'PLAINS' && !ctx.isDefender && ctx.round === 1) ctx.atk += 2;
    if (def.traits.includes('WOODS_MASTER') && terrain === 'WOODS') { ctx.atk += 1; ctx.def += 1; }
    if (def.traits.includes('PLAINS_BONUS') && terrain === 'PLAINS') ctx.atk += 1;
    if (def.traits.includes('MOUNTAIN_HOME') && terrain === 'MOUNTAINS') ctx.def += 2;
    if (def.traits.includes('SNOW_BONUS') && terrain === 'SNOW') { ctx.atk += 2; ctx.def += 2; }
    if (def.traits.includes('PACK_HUNTER')) {
      const wolves = ctx.allies.filter(a => a.hp > 0 && a.id !== ctx.unit.id && a.type === 'UND_WOLF').length;
      ctx.atk += wolves;
    }
  });

  Hooks.on('onCombatInit', (ctx) => {
    if (ctx.defenderTile && ctx.defenderTile.hasTown) ctx.defenderStrikesFirst = true;
  });

  Hooks.on('onTurnStart', (ctx) => {
    const { state, factionId } = ctx;
    for (const u of state.units) {
      if (u.owner !== factionId) continue;
      const def = CONFIG.UNITS[u.type];
      u.mp = def.maxMp;
      u.waited = false;
      if (def.traits.includes('REGENERATE')) {
        u.hp = Math.min(getUnitMaxHp(u), u.hp + 2);
      }
    }
  });

  // =========================================================================
  // 3. UTILITIES & PURE STATE HELPERS
  // =========================================================================
  let nextUid = 1;
  function genId(prefix = 'id') {
    return `${prefix}_${nextUid++}_${Math.floor(Math.random() * 10000)}`;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function() {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function getUnitLevelInfo(unit) {
    let lvl = CONFIG.XP_LEVELS[0];
    for (const row of CONFIG.XP_LEVELS) {
      if (unit.xp >= row.xp) lvl = row;
    }
    return lvl;
  }

  function getUnitMaxHp(unit) {
    return CONFIG.UNITS[unit.type].maxHp + getUnitLevelInfo(unit).hp;
  }

  function getTile(state, x, y) {
    if (x < 0 || y < 0 || x >= state.map.width || y >= state.map.height) return null;
    return state.map.tiles[y * state.map.width + x];
  }

  function getTownAt(state, x, y) {
    return state.towns.find(t => t.x === x && t.y === y) || null;
  }

  function getUnitsAt(state, x, y) {
    return state.units.filter(u => u.x === x && u.y === y);
  }

  function createUnit(type, owner, x, y, bandId = null) {
    const def = CONFIG.UNITS[type];
    return {
      id: genId('u'), type, owner, x, y,
      hp: def.maxHp, mp: def.maxMp, xp: 0, bandId, waited: false
    };
  }
  function getDifficulty(state) {
    return CONFIG.DIFFICULTIES[(state && state.difficulty) || 'normal'] || CONFIG.DIFFICULTIES.normal;
  }

  // =========================================================================
  // 4. MAP GENERATOR
  // =========================================================================
  const TOWN_NAMES = [
    'Oakenshield', 'Frostpeak', 'Silverkeep', 'Briarwood', 'Ravenrock',
    'Sunhaven', 'Ironforge', 'Mistvale', 'Shadowfen', 'Goldcrest',
    'Starfall', 'Thornwatch', 'Highgard', 'Ashford', 'Deepwell', 'Cragmoor'
  ];

  const MapGen = {
    generate(humanFaction = 'EMPIRE', seed = Date.now(), difficulty = 'normal') {
      const diff = CONFIG.DIFFICULTIES[difficulty] || CONFIG.DIFFICULTIES.normal;
      const rng = mulberry32(seed);
      const w = CONFIG.MAP_WIDTH;
      const h = CONFIG.MAP_HEIGHT;

      const grid = Array.from({ length: h }, () => Array.from({ length: w }, () => rng()));
      const smooth = (x, y) => {
        let sum = 0, count = 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const nx = Math.max(0, Math.min(w - 1, x + dx));
            const ny = Math.max(0, Math.min(h - 1, y + dy));
            sum += grid[ny][nx]; count++;
          }
        }
        return sum / count;
      };

      const tiles = [];
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const elev = smooth(x, y);
          const lat = Math.abs((y / (h - 1)) - 0.5) * 2;
          let terrain = 'PLAINS';
          if (elev > 0.66) terrain = 'MOUNTAINS';
          else if (lat > 0.78 || (elev > 0.58 && lat > 0.55)) terrain = 'SNOW';
          else if (elev > 0.45) terrain = 'WOODS';
          tiles.push({ x, y, terrain, hasTown: false });
        }
      }

      const targetTowns = CONFIG.TOWN_COUNT_MIN + Math.floor(rng() * (CONFIG.TOWN_COUNT_MAX - CONFIG.TOWN_COUNT_MIN + 1));
      const towns = [];
      let attempts = 0;
      while (towns.length < targetTowns && attempts < 1000) {
        attempts++;
        const x = 1 + Math.floor(rng() * (w - 2));
        const y = 1 + Math.floor(rng() * (h - 2));
        const tile = tiles[y * w + x];
        if (tile.terrain === 'MOUNTAINS') continue;
        if (towns.some(t => Math.abs(t.x - x) + Math.abs(t.y - y) < CONFIG.MIN_TOWN_DIST)) continue;
        tile.hasTown = true;
        towns.push({
          id: genId('t'), name: TOWN_NAMES[towns.length % TOWN_NAMES.length],
          x, y, owner: null, income: CONFIG.TOWN_INCOME, prodUnit: null, nextProdUnit: null, turnsLeft: 0, unlockedUnits: []
        });
      }

      const factionIds = ['EMPIRE', 'SYLVAN', 'UNDEAD'];
      for (let i = factionIds.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [factionIds[i], factionIds[j]] = [factionIds[j], factionIds[i]];
      }
      const startTowns = [];
      if (towns.length >= 3) {
        startTowns.push(towns[0]);
        while (startTowns.length < 3) {
          let best = null, bestDist = -1;
          for (const t of towns) {
            if (startTowns.includes(t)) continue;
            const minD = Math.min(...startTowns.map(s => Math.hypot(s.x - t.x, s.y - t.y)));
            if (minD > bestDist) { bestDist = minD; best = t; }
          }
          if (best) startTowns.push(best); else break;
        }
      }

      const units = [];
      const starters = {
        EMPIRE: ['EMP_SCOUT', 'EMP_GUARD'],
        SYLVAN: ['SYL_PIXIE', 'SYL_ELF'],
        UNDEAD: ['UND_BAT', 'UND_SKEL']
      };

      startTowns.forEach((town, idx) => {
        const fId = factionIds[idx];
        town.owner = fId;
        const [t1, t2] = starters[fId];
        town.prodUnit = t2;
        town.nextProdUnit = null;
        town.unlockedUnits = [t2];
        town.turnsLeft = CONFIG.UNITS[t2].buildTurns;
        units.push(createUnit(t1, fId, town.x, town.y));
        units.push(createUnit(t2, fId, town.x, town.y));
      });
      towns.forEach(town => {
        if (town.owner === null) units.push(createUnit('NEU_MILITIA', 'NEUTRAL', town.x, town.y));
      });

      if (towns.length > 1) {
        const visited = new Set([`${towns[0].x},${towns[0].y}`]);
        const queue = [{ x: towns[0].x, y: towns[0].y }];
        while (queue.length) {
          const cur = queue.shift();
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              if (dx === 0 && dy === 0) continue;
              const nx = cur.x + dx, ny = cur.y + dy;
              if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
              const key = `${nx},${ny}`;
              if (visited.has(key)) continue;
              const tile = tiles[ny * w + nx];
              if (tile.terrain === 'MOUNTAINS' && !tile.hasTown) continue;
              visited.add(key);
              queue.push({ x: nx, y: ny });
            }
          }
        }
        for (const t of towns) {
          if (!visited.has(`${t.x},${t.y}`)) {
            let cx = t.x, cy = t.y;
            while (cx !== towns[0].x || cy !== towns[0].y) {
              tiles[cy * w + cx].terrain = 'PLAINS';
              if (cx < towns[0].x) cx++; else if (cx > towns[0].x) cx--;
              if (cy < towns[0].y) cy++; else if (cy > towns[0].y) cy--;
            }
          }
        }
      }

      return {
        version: 1, turn: 1, activeFaction: humanFaction, humanFaction, difficulty: diff.id, winner: null,
        factions: {
          EMPIRE: { gold: 150, alive: true },
          SYLVAN: { gold: 150, alive: true },
          UNDEAD: { gold: 150, alive: true }
        },
        map: { width: w, height: h, tiles },
        towns, units
      };
    }
  };

  // =========================================================================
  // 5. MOVEMENT & BANDING SYSTEM
  // =========================================================================
  const MovementSystem = {
    getMoveGroup(state, unit) {
      if (!unit) return [];
      if (unit.bandId) return state.units.filter(u => u.bandId === unit.bandId && u.owner === unit.owner);
      return [unit];
    },
    getGroupMp(group) {
      return group.length ? Math.min(...group.map(u => u.mp)) : 0;
    },
    getStepCost(state, group, tile) {
      let maxCost = 0;
      for (const u of group) {
        const base = tile.hasTown ? CONFIG.TERRAIN.TOWN.moveCost : CONFIG.TERRAIN[tile.terrain].moveCost;
        const ctx = Hooks.emit('onMoveCost', { unit: u, tile, cost: base });
        if (ctx.cost === Infinity) return Infinity;
        if (ctx.cost > maxCost) maxCost = ctx.cost;
      }
      return maxCost;
    },
    getReachableTiles(state, group) {
      const start = group[0];
      const maxMp = this.getGroupMp(group);
      const dist = new Map();
      const key = (x, y) => `${x},${y}`;
      dist.set(key(start.x, start.y), 0);
      const pq = [{ x: start.x, y: start.y, cost: 0 }];
      const reachable = new Map();

      while (pq.length) {
        pq.sort((a, b) => a.cost - b.cost);
        const cur = pq.shift();
        const curKey = key(cur.x, cur.y);
        if (cur.cost > dist.get(curKey)) continue;

        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const nx = cur.x + dx, ny = cur.y + dy;
            const tile = getTile(state, nx, ny);
            if (!tile) continue;
            const unitsHere = getUnitsAt(state, nx, ny);
            const hasEnemy = unitsHere.some(u => u.owner !== start.owner);
            const town = getTownAt(state, nx, ny);
            if (hasEnemy || (town && town.owner !== start.owner)) continue;
            const stepCost = this.getStepCost(state, group, tile);
            if (stepCost === Infinity) continue;
            const newCost = cur.cost + stepCost;
            if (newCost <= maxMp) {
              const nKey = key(nx, ny);
              if (!dist.has(nKey) || newCost < dist.get(nKey)) {
                dist.set(nKey, newCost);
                pq.push({ x: nx, y: ny, cost: newCost });
                if (unitsHere.length + group.length <= CONFIG.MAX_STACK) {
                  reachable.set(nKey, { x: nx, y: ny, cost: newCost });
                }
              }
            }
          }
        }
      }
      return { reachable };
    },
    moveGroup(state, group, destX, destY) {
      const { reachable } = this.getReachableTiles(state, group);
      const info = reachable.get(`${destX},${destY}`);
      if (!info) return false;
      const now = typeof performance !== 'undefined' ? performance.now() : 0;
      for (const u of group) {
        if (typeof animatingUnits !== 'undefined') {
          animatingUnits.set(u.id, { fromX: u.x, fromY: u.y, toX: destX, toY: destY, start: now, duration: 200 });
        }
        u.x = destX; u.y = destY; u.mp = Math.max(0, u.mp - info.cost);
      }
      if (typeof startAnimLoop === 'function') startAnimLoop();
      return true;
    },
    bandUnitsAt(state, x, y, owner) {
      const units = getUnitsAt(state, x, y).filter(u => u.owner === owner);
      if (units.length < 2) return null;
      const bandId = genId('b');
      for (const u of units) u.bandId = bandId;
      return bandId;
    },
    disbandGroup(state, group) {
      for (const u of group) u.bandId = null;
    }
  };

  // =========================================================================
  // 6. COMBAT SYSTEM
  // =========================================================================
  const CombatSystem = {
    isAdjacent(x1, y1, x2, y2) {
      return Math.max(Math.abs(x1 - x2), Math.abs(y1 - y2)) === 1;
    },
    rollDice(count, target) {
      let hits = 0; const rolls = [];
      for (let i = 0; i < count; i++) {
        const r = 1 + Math.floor(Math.random() * 6);
        rolls.push(r); if (r >= target) hits++;
      }
      return { hits, rolls };
    },
    getEffectiveStats(unit, tile, allies, enemies, isDefender, round = 1) {
      const def = CONFIG.UNITS[unit.type];
      const lvl = getUnitLevelInfo(unit);
      const tMod = CONFIG.TERRAIN_MODS[tile.hasTown ? 'TOWN' : tile.terrain];
      const ctx = {
        unit, tile, allies, enemies, isDefender, round,
        atk: def.atk + lvl.atk + tMod.defaultAtk,
        def: def.def + lvl.def + tMod.defaultDef
      };
      Hooks.emit('onCalculateCombatStats', ctx);
      return { atk: Math.max(1, ctx.atk), def: Math.max(1, ctx.def) };
    },
    resolveCombat(state, attackerGroup, defX, defY) {
      const defenderTile = getTile(state, defX, defY);
      const town = getTownAt(state, defX, defY);
      const defenders = getUnitsAt(state, defX, defY);
      if (defenders.length === 0 && !town) return null;
      for (const d of defenders) if (d.type === 'NEU_MILITIA') d.revealed = true;
      for (const u of attackerGroup) u.mp = Math.max(0, u.mp - Math.min(2, u.mp));

      const A = [...attackerGroup].sort((a, b) => CONFIG.UNITS[a.type].role - CONFIG.UNITS[b.type].role);
      const D = [...defenders].sort((a, b) => CONFIG.UNITS[a.type].role - CONFIG.UNITS[b.type].role);
      const initCtx = Hooks.emit('onCombatInit', { attackerBand: A, defenderBand: D, defenderTile, defenderStrikesFirst: false });

      const log = [];
      if (initCtx.defenderStrikesFirst) log.push('🏰 Town Defense: Defender strikes first (Round 1)!');

      let ai = 0, di = 0, round = 0;
      while (ai < A.length && di < D.length) {
        round++;
        const atkUnit = A[ai], defUnit = D[di];
        const atkStats = this.getEffectiveStats(atkUnit, defenderTile, A, D, false, round);
        const defStats = this.getEffectiveStats(defUnit, defenderTile, D, A, true, round);

        const rollStrike = (striker, strikerStats, targetStats) => {
          const atkRoll = this.rollDice(strikerStats.atk, 4);
          const defRoll = this.rollDice(targetStats.def, 5);
          const dmg = Math.max(1, atkRoll.hits - defRoll.hits);
          return { dmg, atkRoll, defRoll };
        };

        const applyStrike = (striker, target, isDefStrike, res) => {
          target.hp = Math.max(0, target.hp - res.dmg);
          log.push(`R${round}: ${CONFIG.UNITS[striker.type].emoji}→${CONFIG.UNITS[target.type].emoji} (${res.atkRoll.hits} hits vs ${res.defRoll.hits} blk) = ${res.dmg} dmg`);
          Hooks.emit('onCombatRound', { round, striker, target, isDefender: isDefStrike, dmg: res.dmg, atkRoll: res.atkRoll, defRoll: res.defRoll });
        };

        if (round === 1 && initCtx.defenderStrikesFirst) {
          applyStrike(defUnit, atkUnit, true, rollStrike(defUnit, defStats, atkStats));
          if (atkUnit.hp > 0) {
            applyStrike(atkUnit, defUnit, false, rollStrike(atkUnit, atkStats, defStats));
          }
        } else {
          // Simultaneous exchange
          const atkRes = rollStrike(atkUnit, atkStats, defStats);
          const defRes = rollStrike(defUnit, defStats, atkStats);
          applyStrike(atkUnit, defUnit, false, atkRes);
          applyStrike(defUnit, atkUnit, true, defRes);
        }

        if (atkUnit.hp <= 0) { log.push(`💀 ${CONFIG.UNITS[atkUnit.type].name} defeated!`); this.awardXp(defUnit, 15, log); this.removeUnit(state, atkUnit, defUnit, defenderTile); ai++; }
        if (defUnit.hp <= 0) { log.push(`💀 ${CONFIG.UNITS[defUnit.type].name} defeated!`); this.awardXp(atkUnit, 15, log); this.removeUnit(state, defUnit, atkUnit, defenderTile); di++; }
      }

      for (const u of A) if (u.hp > 0) this.awardXp(u, 10, log);
      for (const u of D) if (u.hp > 0) this.awardXp(u, 10, log);

      const remainingDefenders = D.filter(u => u.hp > 0);
      const survivingAttackers = A.filter(u => u.hp > 0);
      if (round >= 20 && remainingDefenders.length > 0 && survivingAttackers.length > 0) {
        log.push('⏸️ Stalemate after 20 rounds! Attack with more units.');
      }
      let captured = false;

      if (remainingDefenders.length === 0 && survivingAttackers.length > 0) {
        for (const u of survivingAttackers) { u.x = defX; u.y = defY; }
        if (town && town.owner !== survivingAttackers[0].owner) {
          const oldOwner = town.owner;
          town.owner = survivingAttackers[0].owner;
          town.prodUnit = null; town.nextProdUnit = null; town.turnsLeft = 0; captured = true;
          log.push(`🚩 ${town.name} captured by ${CONFIG.FACTIONS[town.owner].name}!`);
          Hooks.emit('onTownCaptured', { town, oldOwner, newOwner: town.owner, state });
          WinConditionSystem.check(state);
        }
      }
      return { log, captured, survivingAttackers, remainingDefenders };
    },
    awardXp(unit, amount, log) {
      if (unit.owner === 'NEUTRAL') return;
      const oldLvl = getUnitLevelInfo(unit).level;
      unit.xp += amount;
      const newLvlInfo = getUnitLevelInfo(unit);
      Hooks.emit('onUnitGainXP', { unit, amount });
      if (newLvlInfo.level > oldLvl) {
        unit.hp = Math.min(getUnitMaxHp(unit), unit.hp + 2);
        log.push(`⭐ ${CONFIG.UNITS[unit.type].name} reached Level ${newLvlInfo.level}!`);
      }
    },
    removeUnit(state, unit, killer, tile) {
      state.units = state.units.filter(u => u.id !== unit.id);
      if (unit.bandId) {
        const remaining = state.units.filter(u => u.bandId === unit.bandId);
        if (remaining.length === 1) remaining[0].bandId = null;
      }
      Hooks.emit('onUnitDeath', { unit, killer, tile });
    }
  };

  // =========================================================================
  // 7. ECONOMY & WIN CONDITION SYSTEMS
  // =========================================================================
  const EconomySystem = {
    getFactionIncome(state, factionId) {
      return state.towns.filter(t => t.owner === factionId).reduce((s, t) => s + t.income, 0);
    },
    getFactionUpkeep(state, factionId) {
      return state.units.filter(u => u.owner === factionId).reduce((s, u) => s + (CONFIG.UNITS[u.type].upkeep || 0), 0);
    },
    getFactionNetIncome(state, factionId) {
      return this.getFactionIncome(state, factionId) - this.getFactionUpkeep(state, factionId);
    },
    pauseProduction(state, town) {
      town.prodUnit = null;
      town.nextProdUnit = null;
      town.turnsLeft = 0;
    },
    buyProduction(state, town, unitType) {
      const def = CONFIG.UNITS[unitType];
      if (!def || town.owner !== def.faction) return false;
      const unlocked = (town.unlockedUnits ??= []);
      const isUnlocked = unlocked.includes(unitType);
      if (!isUnlocked) {
        const faction = state.factions[town.owner];
        if (faction.gold < def.cost) return false;
        faction.gold -= def.cost;
        unlocked.push(unitType);
      }
      const curDef = town.prodUnit ? CONFIG.UNITS[town.prodUnit] : null;
      const canSwitchNow = !curDef || town.turnsLeft >= curDef.buildTurns;
      if (canSwitchNow) {
        town.prodUnit = unitType;
        town.nextProdUnit = null;
        town.turnsLeft = def.buildTurns;
      } else if (town.prodUnit === unitType) {
        town.nextProdUnit = null;
      } else {
        town.nextProdUnit = unitType;
      }
      return true;
    },
    processTurnStart(state, factionId) {
      const ownedTowns = state.towns.filter(t => t.owner === factionId);
      let income = 0;
      for (const town of ownedTowns) {
        income += town.income;
        if (town.prodUnit) {
          town.turnsLeft--;
          if (town.turnsLeft <= 0) {
            const spawned = this.spawnProducedUnit(state, town);
            if (spawned) {
              if (town.nextProdUnit) {
                town.prodUnit = town.nextProdUnit;
                town.nextProdUnit = null;
              }
              town.turnsLeft = CONFIG.UNITS[town.prodUnit].buildTurns;
            } else {
              town.turnsLeft = 0;
            }
          }
        }
      }
      let upkeep = this.getFactionUpkeep(state, factionId);
      state.factions[factionId].gold += (income - upkeep);
      let disbanded = 0;
      if (state.factions[factionId].gold < 0) {
        state.factions[factionId].gold = 0;
        while (upkeep > income) {
          const mine = state.units.filter(u => u.owner === factionId && (CONFIG.UNITS[u.type].upkeep || 0) > 0);
          if (mine.length === 0) break;
          mine.sort((a, b) => (CONFIG.UNITS[b.type].upkeep - CONFIG.UNITS[a.type].upkeep) || (a.hp - b.hp));
          const victim = mine[0];
          state.units = state.units.filter(u => u.id !== victim.id);
          if (victim.bandId) {
            const remaining = state.units.filter(u => u.bandId === victim.bandId);
            if (remaining.length === 1) remaining[0].bandId = null;
          }
          upkeep -= CONFIG.UNITS[victim.type].upkeep || 0;
          disbanded++;
        }
      }
      Hooks.emit('onTurnStart', { state, factionId, income, upkeep, disbanded });
      return { income, upkeep, disbanded };
    },
    spawnProducedUnit(state, town) {
      if (getUnitsAt(state, town.x, town.y).length < CONFIG.MAX_STACK) {
        state.units.push(createUnit(town.prodUnit, town.owner, town.x, town.y));
        return true;
      }
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const tile = getTile(state, town.x + dx, town.y + dy);
          if (!tile || tile.terrain === 'MOUNTAINS') continue;
          const here = getUnitsAt(state, tile.x, tile.y);
          if (here.some(u => u.owner !== town.owner)) continue;
          if (here.length < CONFIG.MAX_STACK) {
            state.units.push(createUnit(town.prodUnit, town.owner, tile.x, tile.y));
            return true;
          }
        }
      }
      return false;
    }
  };

  const WinConditionSystem = {
    check(state) {
      for (const fId of Object.keys(state.factions)) {
        if (!state.factions[fId].alive) continue;
        if (state.towns.filter(t => t.owner === fId).length === 0) {
          state.factions[fId].alive = false;
          state.units = state.units.filter(u => u.owner !== fId);
          Hooks.emit('onFactionEliminated', { factionId: fId, state });
        }
      }
      const alive = Object.keys(state.factions).filter(f => state.factions[f].alive);
      if (alive.length === 1) state.winner = alive[0];
    }
  };

  // =========================================================================
  // 8. AI CONTROLLER
  // =========================================================================
  const AIController = {
    async runTurn(state, factionId, delayMs = 0, onStep = null) {
      if (!state.factions[factionId].alive || state.winner) return;
      const diff = getDifficulty(state);
      const pause = () => delayMs > 0 ? new Promise(r => setTimeout(r, delayMs)) : null;
      const myTowns = state.towns.filter(t => t.owner === factionId);
      const capital = myTowns[0] || null;
      const netIncome = EconomySystem.getFactionNetIncome(state, factionId);
      const roster = Object.values(CONFIG.UNITS).filter(u => u.faction === factionId);
      for (const town of myTowns) {
        if (netIncome <= 2 && town.prodUnit && (!capital || town.id !== capital.id)) {
          EconomySystem.pauseProduction(state, town);
          continue;
        }
        const wantsBuy = !town.prodUnit
          ? (netIncome > 4 && Math.random() < diff.aiBuyChance)
          : (!town.nextProdUnit && state.factions[factionId].gold > diff.aiUpgradeGold);
        if (wantsBuy) {
          const unlocked = town.unlockedUnits || [];
          const affordable = roster
            .filter(u => (unlocked.includes(u.id) || u.cost <= state.factions[factionId].gold) && u.id !== town.prodUnit && u.id !== town.nextProdUnit)
            .sort((a, b) => b.cost - a.cost);
          if (affordable.length > 0) EconomySystem.buyProduction(state, town, affordable[0].id);
        }
      }
      const processedCoords = new Set();
      for (const u of [...state.units]) {
        if (u.owner !== factionId || u.bandId) continue;
        const key = `${u.x},${u.y}`;
        if (processedCoords.has(key)) continue;
        processedCoords.add(key);
        const coLocated = getUnitsAt(state, u.x, u.y).filter(x => x.owner === factionId && !x.bandId);
        if (coLocated.length >= 2) {
          const bandId = genId('b');
          coLocated.slice(0, diff.aiMaxBand).forEach(x => { x.bandId = bandId; });
        }
      }
      const actedIds = new Set();
      for (const u of [...state.units]) {
        if (!state.units.includes(u) || u.owner !== factionId || actedIds.has(u.id)) continue;
        const group = MovementSystem.getMoveGroup(state, u);
        group.forEach(m => actedIds.add(m.id));
        if (MovementSystem.getGroupMp(group) <= 0) continue;
        const adjTarget = this.findAdjacentTarget(state, u.x, u.y, factionId);
        if (adjTarget) {
          CombatSystem.resolveCombat(state, group, adjTarget.x, adjTarget.y);
          if (onStep) onStep();
          if (delayMs > 0) await pause();
          if (state.winner) return;
          continue;
        }
        // Hold garrison on owned towns based on difficulty
        if (diff.aiGarrison !== 'none') {
          const hereTown = getTownAt(state, u.x, u.y);
          const shouldGarrison = hereTown && hereTown.owner === factionId &&
            (diff.aiGarrison === 'all' || (diff.aiGarrison === 'capital' && capital && hereTown.id === capital.id));
          if (shouldGarrison) {
            const friendlyHere = getUnitsAt(state, u.x, u.y).filter(x => x.owner === factionId);
            if (friendlyHere.length <= group.length) continue;
          }
        }
        if (diff.aiSkipChance > 0 && Math.random() < diff.aiSkipChance) continue;
        const target = this.pickTarget(state, u.x, u.y, factionId);
        if (!target) continue;
        const { reachable } = MovementSystem.getReachableTiles(state, group);
        let bestTile = null, bestDist = Math.hypot(target.x - u.x, target.y - u.y);
        for (const tile of reachable.values()) {
          const d = Math.hypot(target.x - tile.x, target.y - tile.y);
          if (d < bestDist) { bestDist = d; bestTile = tile; }
        }
        if (bestTile) {
          MovementSystem.moveGroup(state, group, bestTile.x, bestTile.y);
          if (onStep) onStep();
          if (delayMs > 0) await pause();
          const adjAfter = this.findAdjacentTarget(state, bestTile.x, bestTile.y, factionId);
          if (adjAfter && MovementSystem.getGroupMp(group) >= 1) {
            CombatSystem.resolveCombat(state, group, adjAfter.x, adjAfter.y);
            if (onStep) onStep();
            if (delayMs > 0) await pause();
            if (state.winner) return;
          }
        }
      }
    },
    findAdjacentTarget(state, x, y, factionId) {
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const nx = x + dx, ny = y + dy;
          const enemies = getUnitsAt(state, nx, ny).filter(u => u.owner !== factionId);
          const town = getTownAt(state, nx, ny);
          if (enemies.length > 0 || (town && town.owner !== factionId)) return { x: nx, y: ny };
        }
      }
      return null;
    },
    pickTarget(state, x, y, factionId) {
      let best = null, bestScore = -Infinity;
      for (const t of state.towns) {
        if (t.owner === factionId) continue;
        const score = (t.owner === null ? 80 : 100) - Math.hypot(t.x - x, t.y - y) * 4;
        if (score > bestScore) { bestScore = score; best = t; }
      }
      for (const u of state.units) {
        if (u.owner === factionId || u.owner === 'NEUTRAL') continue;
        const score = 60 - Math.hypot(u.x - x, u.y - y) * 4;
        if (score > bestScore) { bestScore = score; best = u; }
      }
      return best;
    }
  };

  const StorageSystem = {
    save(state, slot = 'autosave') {
      try { localStorage.setItem(`emoji_warlords_${slot}`, JSON.stringify(state)); return true; } catch (e) { return false; }
    },
    load(slot = 'autosave') {
      try { const raw = localStorage.getItem(`emoji_warlords_${slot}`); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
    }

    test_town_blueprints_and_queued_switch() {
